<h2 style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-weight:600;color:#1f1c17;margin:0 0 12px">Your Sundial sign-in code</h2>
<p style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#6b645a;margin:0 0 20px">Enter this code on the sign-in page. It expires in one hour.</p>
<p style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:32px;letter-spacing:8px;font-weight:600;color:#1f1c17;margin:0 0 28px">{{ .Token }}</p>
<p style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#6b645a;margin:0 0 8px">Or open Sundial from this link and press Continue:</p>
<p style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;margin:0 0 28px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="color:#b8621b">Sign in to Sundial</a></p>
<p style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#9b9387;font-size:12px;margin:0">If you didn't ask to sign in, you can ignore this email.</p>
